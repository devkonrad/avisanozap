<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | AvisanoZap</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f7f6;
            color: #24312c;
            margin: 0;
            padding: 32px 16px;
        }
        main {
            max-width: 440px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px #0000000d;
        }
        h1 { margin-top: 0; }
        label { display: block; margin-bottom: 6px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd5d0;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #176b50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #176b50; }
        .errorlist { color: #b42318; }
    </style>
</head>
<body>
    <main>
        <h1>Recuperar senha</h1>

        <p>
            Informe o e-mail cadastrado. Se houver uma conta elegível,
            enviaremos as instruções para redefinir sua senha.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <p>
                <label for="{{ form.email.id_for_label }}">E-mail</label>
                {{ form.email }}
                {{ form.email.errors }}
            </p>

            <button type="submit">Enviar instruções</button>
        </form>

        <p>
            <a href="{% url 'accounts:login' %}">
                Voltar para o login
            </a>
        </p>
    </main>
</body>
</html>
