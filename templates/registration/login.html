<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | AvisanoZap</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f7f6;
            color: #24312c;
            margin: 0;
            padding: 32px 16px;
        }
        main {
            max-width: 440px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px #0000000d;
        }
        h1 { margin-top: 0; }
        form p { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd5d0;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #176b50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #176b50; }
        .errorlist { color: #b42318; }
    </style>
</head>
<body>
    <main>
        <h1>Entrar no AvisanoZap</h1>

        {% if form.errors %}
            <p>Não foi possível entrar. Confira o usuário e a senha.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'' }}">

            {{ form.as_p }}

            <button type="submit">Entrar</button>
        </form>

        <p>
            <a href="{% url 'accounts:password_reset' %}">
                Esqueci minha senha
            </a>
        </p>

        <p>
            Ainda não tem conta?
            <a href="{% url 'accounts:signup' %}">Cadastre-se</a>
        </p>

        <p><a href="{% url 'home' %}">Voltar ao início</a></p>
    </main>
</body>
</html>
