<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | AvisanoZap</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f7f6;
            color: #24312c;
            margin: 0;
            padding: 32px 16px;
        }
        main {
            max-width: 520px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 32px #0000000d;
        }
        h1 { margin-top: 0; }
        form p { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd5d0;
            border-radius: 8px;
        }
        input:disabled {
            background: #f0f3f1;
            color: #526159;
            cursor: not-allowed;
            opacity: 1;
        }
        .helptext, ul {
            font-size: 13px;
            color: #68756e;
        }
        .notice {
            padding: 12px;
            border-radius: 8px;
            background: #f0f7f3;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #176b50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #176b50; }
        .errorlist { color: #b42318; }
    </style>
</head>

<body>
    <main>
        <h1>Crie sua conta</h1>
        <p>Cadastre seu perfil profissional para começar.</p>

        {% if subscription_id %}
            <p class="notice">
                Seu e-mail e WhatsApp foram preenchidos com os dados
                informados na compra e não podem ser alterados neste cadastro.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <input
                type="hidden"
                name="subscription"
                value="{{ subscription_id }}"
            >

            {{ form.as_p }}

            <button type="submit">Criar conta</button>
        </form>

        <p>Já tem uma conta?
            <a href="{% url 'accounts:login' %}">Entrar</a>
        </p>

        <p>
            <a href="{% url 'home' %}">Voltar ao início</a>
        </p>
    </main>
</body>
</html>
