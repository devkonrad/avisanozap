services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://saas_user:saas_pass@db:5432/saas_db
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EVOLUTION_API_URL: http://whatsapp_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: avisanozap
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  celery_worker:
    build: .
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://saas_user:saas_pass@db:5432/saas_db
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EVOLUTION_API_URL: http://whatsapp_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: avisanozap
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A core beat -l info
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://saas_user:saas_pass@db:5432/saas_db
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      PYTHONPATH: /app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EVOLUTION_API_URL: http://whatsapp_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: avisanozap
    depends_on:
      - db
      - redis

  whatsapp_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: avisanozap_whatsapp_api_1
    ports:
      - "8090:8080"
    environment:
      SERVER_URL: http://localhost:8090
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://saas_user:saas_pass@db:5432/evolution_db
      CACHE_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_LOCAL_ENABLED: "true"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1033773198
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  evolution_instances:
